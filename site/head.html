<title>Statcast Reality Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f6f9fc; --card:#fff; --sunk:#eaf1f8; --line:#d3dee8; --hair:#e3ebf2;
  --ink:#0d1b2a; --ink2:#3c4f61; --ink3:#6d8092;
  --hot:#e0332a; --hot-s:#fce4e2; --cold:#0c64d6; --cold-s:#e2edfc; --mid:#9db0c2;
  --luck:#8b5cc4; --right:#1d8a4a; --right-s:#e3f4e9; --wrong:#c7302a; --wrong-s:#fbe4e2;
  --ac:#0c64d6; --ac-s:#e2edfc;
  /* type scale -- one ratio, used everywhere, so nothing is sized by feel */
  --serif:"IBM Plex Serif",Georgia,serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --fs-display:clamp(31px,5.2vw,46px);
  --fs-h1:clamp(26px,4.4vw,36px);
  --fs-h2:20px; --fs-lede:17px; --fs-body:14.5px; --fs-micro:10.5px;
  --measure:68ch;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#101216; --card:#191c22; --sunk:#20242b; --line:#2f353f; --hair:#262b33;
  --ink:#e8ebef; --ink2:#a6adb8; --ink3:#767d89;
  --hot:#e07a63; --hot-s:#33211c; --cold:#6fa6d8; --cold-s:#17242f; --mid:#5a626e;
  --luck:#b394e0; --right:#5cc28a; --right-s:#15281d; --wrong:#e8736b; --wrong-s:#33191a;
  --ac:#6fa6d8; --ac-s:#1a2733;
}}
:root[data-theme="dark"]{
  --bg:#101216; --card:#191c22; --sunk:#20242b; --line:#2f353f; --hair:#262b33;
  --ink:#e8ebef; --ink2:#a6adb8; --ink3:#767d89;
  --hot:#e07a63; --hot-s:#33211c; --cold:#6fa6d8; --cold-s:#17242f; --mid:#5a626e;
  --luck:#b394e0; --right:#5cc28a; --right-s:#15281d; --wrong:#e8736b; --wrong-s:#33191a;
  --ac:#6fa6d8; --ac-s:#1a2733;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-block:30px 60px;padding-left:16px;padding-right:16px;
  display:flex;flex-direction:column;gap:30px}
.wrap > header{display:flex;flex-direction:column;gap:9px}
.eb{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink3);margin:0}
h1{font-family:var(--serif);font-size:var(--fs-h1);font-weight:600;letter-spacing:-.021em;
  margin:0;line-height:1.05;text-wrap:balance}
.note{font-size:var(--fs-body);line-height:1.62;color:var(--ink2);margin:0;max-width:var(--measure)}
.note a,.limits a,.wrap > footer a{color:var(--ac)}

/* inline term definitions -- tap/click toggles, hover/focus previews */
.term{font:inherit;background:none;border:none;padding:0;margin:0;color:inherit;cursor:help;
  position:relative;border-bottom:1px dotted var(--ink3);display:inline}
.term:hover .tip,.term:focus .tip,.term.open .tip{opacity:1;visibility:visible;transform:translateY(0)}
/* position:fixed, placed by app.js from the term's rect: tables live inside overflow
   containers, and an absolutely positioned popover there either clips or widens the scroll */
.term .tip{position:fixed;left:0;top:0;z-index:50;width:max-content;max-width:240px;
  background:var(--ink);color:var(--card);font-family:var(--sans);font-size:12px;font-weight:400;
  line-height:1.45;text-align:left;padding:8px 10px;border-radius:5px;letter-spacing:0;
  white-space:normal;
  text-transform:none;opacity:0;visibility:hidden;transform:translateY(-3px);
  transition:opacity .12s,transform .12s;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.term:not(:hover):not(:focus):not(.open) .tip{display:none}

/* side-by-side layouts. Collapse to one column below ~1000px, where the widest
   table (the change-log board, ~750px) would otherwise need to scroll. */
.top{display:flex;flex-direction:column;gap:22px}
.top > header h1{margin:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.split-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.split-side{position:sticky;top:16px;min-width:0;max-height:calc(100vh - 32px);overflow:auto;
  border-radius:7px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:center}
.out.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.split-main .lg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 20px}
.sum-dir-stack{display:none}
@media(max-width:1000px){
  .top,.split,.pair{grid-template-columns:1fr}
  .sum-dir-side{display:none} .sum-dir-stack{display:inline}
  .split-side{position:static;max-height:none;overflow:visible}
}

/* player check card */
.verdict{border-radius:8px;padding:16px 18px;border:1px solid var(--hair);border-left:4px solid var(--ink3);
  background:var(--card);display:flex;flex-direction:column;gap:4px}
.verdict b{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.012em;line-height:1.25}
.verdict p{margin:0;font-size:14px;line-height:1.55;color:var(--ink2)}
.verdict.hot{border-left-color:var(--hot);background:var(--hot-s)}
.verdict.cold{border-left-color:var(--cold);background:var(--cold-s)}
.pc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pc-grid > section{background:var(--card);border:1px solid var(--hair);border-radius:8px;padding:14px 15px;
  display:flex;flex-direction:column;gap:10px;min-width:0}
.pc-grid h3{margin:0;font-size:11px;font-family:var(--mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);font-weight:500}
.pc-grid .rows{display:flex;flex-direction:column;gap:3px}
.pc-grid .row{grid-template-columns:minmax(0,1fr) 46px minmax(60px,1.1fr) 62px;gap:8px;padding:6px 8px}
.pc-grid .row .nm{flex-wrap:wrap;gap:2px 6px;font-size:12px}
.pc-note{margin:0;font-size:12.5px;line-height:1.55;color:var(--ink3)}
.pc-list{margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--ink2)}
.pc-list b{color:var(--ink);font-weight:600}
.pc-tiles .v{font-size:22px}
.pc-big{margin:0;font-size:13.5px;color:var(--ink2)}
.pc-big b{font-family:var(--serif);font-size:24px;color:var(--ink);font-weight:600}
.pc-links{display:flex;gap:22px;margin:0;font-size:13px}
.pc-links a{color:var(--ac);text-decoration:none}
.pc-links a:hover{text-decoration:underline}
@media(max-width:1000px){.pc-grid{grid-template-columns:1fr}}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  font:inherit;font-size:13px;font-weight:500;color:var(--ink3);padding:9px 14px;cursor:pointer;
  margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ac);border-bottom-color:var(--ac);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}
.panel{display:flex;flex-direction:column;gap:22px}
[hidden]{display:none!important}

/* controls */
.ctrl{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;background:var(--card);
  border:1px solid var(--hair);border-radius:6px;padding:13px 15px}
.f{display:flex;flex-direction:column;gap:4px}
/* "what does this control affect" -- one small label on every control group */
.scope{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ac);margin:0}
.ctrl > .scope{flex-basis:100%;margin-bottom:-6px}
.tfoot{margin:-6px 0 0;font-size:12px;color:var(--ink3);line-height:1.5;max-width:90ch}
.tfoot:empty{display:none}
.sechead-row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 20px;flex-wrap:wrap}
.f.inline{flex-direction:row;align-items:center;gap:8px}
.cgroup{display:flex;flex-direction:column;gap:8px;align-self:flex-start}
.cgroup + .cgroup{border-left:1px solid var(--hair);padding-left:18px}
.cg-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
@media(max-width:640px){.cgroup + .cgroup{border-left:0;padding-left:0;border-top:1px solid var(--hair);padding-top:12px}}
.f>span{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3)}
select,input[type=number],input[type=text]{font:inherit;font-size:13px;background:var(--card);
  color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 9px;max-width:100%}
select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}

.hdr{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.big{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.017em}
.sub{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink3)}
.warnbar{border-left:3px solid var(--hot);background:var(--hot-s);padding:11px 14px;
  font-size:13px;color:var(--ink2);border-radius:0 4px 4px 0}
/* An empty warn bar still paints its background and border, so a cleared
   warning leaves a coloured stripe under the headline. */
.warnbar:empty{display:none}
.infobar{border-left:3px solid var(--ac);background:var(--ac-s);padding:11px 14px;
  font-size:13px;color:var(--ink2);border-radius:0 4px 4px 0}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--ink3);align-items:center}
.lg i{display:inline-block;width:20px;height:10px;vertical-align:-1px;margin-right:5px;border-radius:2px}

/* percentile rows */
.grp{display:flex;flex-direction:column;gap:3px}
.gh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px 5px;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3)}
.row{display:grid;grid-template-columns:152px 66px 1fr 84px;gap:12px;align-items:center;
  padding:7px 10px;background:var(--card);border:1px solid var(--hair)}
.nm{font-size:12.5px;display:flex;align-items:center;gap:6px}
.val{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.bar{position:relative;height:17px;background:var(--sunk)}
.fill{position:absolute;top:0;bottom:0;}
/* the part of the raw percentile that shrinking took away: hatched in the row's own color */
.noise{position:absolute;top:0;bottom:0;opacity:.45;
  background:repeating-linear-gradient(135deg,currentColor 0 1.5px,transparent 1.5px 5px)}
.mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.25;left:50%}
.pct{font-family:var(--mono);font-size:13px;font-weight:600;text-align:right;
  font-variant-numeric:tabular-nums}
.rawpct{font-size:10px;color:var(--ink3);margin-left:4px;font-weight:400}
.axis{display:grid;grid-template-columns:152px 66px 1fr 84px;gap:12px;padding:0 10px 2px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.axis > span:nth-child(2),.axis > span:last-child{text-align:right}
.axis .ax{display:grid;grid-template-columns:1fr auto 1fr}
.axis .ax > span:last-child{text-align:right}
@media(max-width:640px){.axis{display:none}}
.relchip{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.04em;padding:1px 5px;
  background:var(--sunk);color:var(--ink3);white-space:nowrap}

/* comp cards */
.cmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:9px}
.cc{background:var(--card);border:1px solid var(--hair);border-radius:5px;padding:11px 13px;
  display:flex;flex-direction:column;gap:3px}
.cc .t{font-weight:600;font-size:14px}
.cc .w{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3)}
.cc .s{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink2)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--hair);border-radius:5px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:6px 11px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--hair)}
th:first-child,td:first-child,th.l,td.l{text-align:left}
thead th{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink3);font-weight:500;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--card)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sunk)}
td.up{color:var(--hot);font-weight:600}
td.dn{color:var(--cold);font-weight:600}
.chip{font-family:"IBM Plex Mono",monospace;font-size:9.5px;padding:1px 6px;border-radius:9px;
  background:var(--sunk);color:var(--ink3)}
/* held: neutral on purpose -- red/blue already mean direction everywhere else */
.chip.ok{background:var(--ink);color:var(--card);font-weight:600}
.chip.no{background:none;color:var(--ink3);border:1px solid var(--hair)}

code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:var(--card);
  padding:1px 5px;border-radius:3px;border:1px solid var(--hair)}

/* planner */
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--hair);border-radius:6px;padding:14px;
  display:flex;flex-direction:column;gap:5px}
.tile .k{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink3)}
.tile .v{font-size:27px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  line-height:1.1}
.tile .d{font-size:11.5px;color:var(--ink3)}
.tile.warn .v{color:var(--hot);font-size:19px}
.spark{display:block;width:100%;height:auto}

.wrap > footer{border-top:1px solid var(--line);padding-top:16px;font-size:11.5px;
  color:var(--ink3);max-width:86ch}
h2.sec{font-family:var(--serif);font-size:var(--fs-h2);font-weight:600;letter-spacing:-.012em;margin:0}

/* ---- "what this is for" blocks ---- */
/* <details>, so the lede is always visible and the rest is one click away
   without any script owning the state. */
.use{border:1px solid var(--hair);border-left:3px solid var(--ac);background:var(--card);
  border-radius:0 6px 6px 0;padding:15px 18px;display:flex;flex-direction:column;gap:11px}
.use > summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:7px;
  position:relative;padding-right:92px}
.use > summary::-webkit-details-marker{display:none}
.use > summary:focus-visible{outline:2px solid var(--ac);outline-offset:4px;border-radius:3px}
.use .k{font-family:var(--mono);font-size:var(--fs-micro);font-weight:500;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink3)}
.use .lede{display:block;font-size:var(--fs-lede);line-height:1.5;color:var(--ink);max-width:62ch}
/* the affordance has to say which way it goes, so the label flips with state */
.use .more{position:absolute;top:0;right:0;font-family:var(--mono);font-size:11px;color:var(--ac)}
.use .more::after{content:"read more +"}
.use[open] .more::after{content:"less \2212"}
.use p{margin:0;font-size:var(--fs-body);line-height:1.68;color:var(--ink2);max-width:var(--measure)}
.use p b{color:var(--ink)}
.use > summary + p{margin-top:4px}
.use code{font-family:var(--mono);font-size:11.5px;background:var(--sunk);
  padding:1px 5px;border-radius:3px;border:1px solid var(--hair)}
@media(max-width:560px){.use > summary{padding-right:0}.use .more{position:static;align-self:flex-start}}
.hits{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3);
  align-self:flex-end;padding-bottom:7px}
label.ck{flex-direction:row;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);
  cursor:pointer;padding-bottom:7px}
label.ck input{margin:0;accent-color:var(--ac)}
.moref{padding-bottom:7px}
.moref > summary{cursor:pointer;font-size:12.5px;color:var(--ac);list-style:none}
.moref > summary::-webkit-details-marker{display:none}
.moref > summary::after{content:" +"}
.moref[open] > summary::after{content:" \2212"}
.moref[open]{flex-basis:100%}
.moref-in{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;padding-top:10px;
  border-top:1px dashed var(--hair)}


/* head-to-head: where the uncertainty comes from. One bar, three segments,
   summing to the whole variance -- the point being how little of it is talent. */
.vsbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:2px 0 14px;
  background:var(--sunk)}
.vsbar span{display:block;height:100%}
.vsbar span:not(:last-child){border-right:1px solid var(--card)}
#vs-head .unit{font-size:15px;font-weight:600;color:var(--ink2);letter-spacing:0}

/* The tab's question, under the page title. Deliberately the plainest sentence
   on the page: the title names the tool, this says what it is for. */
.qline{margin:6px 0 0;font-family:var(--serif);font-size:var(--fs-lede);
  line-height:1.4;color:var(--ink2);max-width:52ch}

/* Head to head: the sentence that says what the headline percentage is a
   percentage OF. Without it "80% Aaron Judge" is a number with no predicate. */
.claim{margin:8px 0 0;font-size:var(--fs-lede);line-height:1.5;color:var(--ink);max-width:60ch}
.claim b{font-weight:600}
#vs-split{margin:18px 0 6px}
#vs-split .scope{margin-bottom:7px}
#vs-split .lg{margin-top:9px}
#vs-split .lg b{color:var(--ink);font-weight:600}

/* The calibration row matching what is currently on screen. Not :hover's --sunk,
   which would make the two states indistinguishable under the cursor. */
tbody tr.hl td{background:var(--sunk)}
/* The accent rule belongs to the row, so it goes on the first cell only --
   on every cell it draws a blue bar between each column instead. */
tbody tr.hl td:first-child{box-shadow:inset 2px 0 0 var(--ac);font-weight:600;color:var(--ink)}
.note.wrong{border-left:3px solid var(--cold);padding:9px 0 9px 12px;margin:0 0 12px}

/* ---- the global setting strip -------------------------------------------
   Shaped so it cannot be mistaken for one of the per-tab .ctrl cards: no card
   background, no radius, rules above and below, and the label carries the
   current state as a sentence instead of a caption. */
.gbar{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:var(--sunk);padding:11px 14px;margin:0}
.gbar-state{margin:0;flex-basis:100%;font-family:var(--mono);font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
.gbar-ctl{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.gbar .sub{padding-bottom:2px}
/* A tab that ignores the global setting says so and means it. */
.gbar.off{background:transparent}
.gbar.off .gbar-state{color:var(--ink3)}
.gbar.off .gbar-ctl{opacity:.45}
.gbar.off select{cursor:not-allowed}

/* Per-tab captions step down now that the accent belongs to the global bar,
   so the page has one loud label rather than four competing ones. */
.panel .scope{color:var(--ink3)}

/* ---- how each estimate was reached --------------------------------------
   Two small ledgers, one per player: what he has done this season, what he
   usually is, and how much weight each supplied. The weight bars are the
   shrinkage made literal -- a short season simply cannot fill its bar. */
.pests{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:12px}
.pest{border:1px solid var(--hair);border-radius:6px;background:var(--card);padding:12px 14px}
.pest-h{margin:0;display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.pest-h b{font-size:var(--fs-lede);font-weight:600}
.pest-v{font-family:var(--mono);font-size:var(--fs-lede);font-weight:600;color:var(--ink)}
.pest-l{margin:1px 0 9px;font-size:var(--fs-micro);color:var(--ink3);
  font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
.pest-rows{display:flex;flex-direction:column;gap:6px}
.pest-row{display:grid;grid-template-columns:5.6em 3.4em 1fr 64px 2.6em;gap:8px;
  align-items:center;font-size:var(--fs-body)}
.pest-row .pl{color:var(--ink2)}
.pest-row .pv{font-family:var(--mono);color:var(--ink)}
.pest-row .pn{color:var(--ink3);font-size:var(--fs-micro)}
.pest-row .pw{background:var(--sunk);height:7px;border-radius:4px;overflow:hidden}
.pest-row .pw i{display:block;height:100%;background:var(--ac);border-radius:4px}
.pest-row .pp{font-family:var(--mono);font-size:var(--fs-micro);color:var(--ink2);text-align:right}
