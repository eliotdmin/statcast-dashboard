# Single source of truth for column definitions.
# audit.py reads applies_when / range from here; make_dictionary.py renders DATA_DICTIONARY.md.
# Edit this file, never the generated markdown.

meta:
  title: Data Dictionary
  generated_by: make_dictionary.py from schema.yaml -- edit the YAML, not the markdown
  intro: 'Every column stored by this pipeline: what it is, what unit it is in, and what will burn you
    if you use it naively.


    **This file is generated.** `schema.yaml` is the single source of truth, and `audit.py` reads the
    same file for its applicability conditions and plausible ranges. That is deliberate: when the documentation
    and the checks are two hand-maintained copies of the same facts, they drift, and the documentation
    is the copy that drifts silently.


    **Availability is measured, not asserted.** Savant adds and drops columns between seasons. Where a
    column carries a ''since'' season below, treat it as a prior to be checked against the coverage table
    in the audit report, not as ground truth.


    **Sign conventions are the most common silent error in this data.** Anything marked with a warning
    below has a sign or frame of reference that is easy to get backwards, and getting it backwards produces
    plausible-looking numbers rather than an error.


    **Definitions reconciled against Savant''s own CSV documentation on 2026-09-10.** Where this file
    and that page disagreed, the page won; where the page is silent, the entry says so and the value was
    inferred from the data.'
  gotchas:
  - The strike zone changes definition in 2026 (operator-set through 2025, ABS-defined after). Any zone-based
    metric computed across 2025 and 2026 is comparing two different instruments.
  - '`player_name` is the PITCHER. Join on batter / pitcher IDs, never on the name column.'
  - xwOBA and xBA disagree about non-contact events. In this data xwOBA carries strikeouts and walks at
    their linear weight; xBA does not. Filter contact with `type = 'X'`, never with a null check, and
    confirm the convention is the same in every season you pool.
  - '`game_type` includes spring training and postseason. Filter to ''R''.'
  - Handedness sign conventions on `pfx_x` and `plate_x` will silently cancel effects if you pool without
    flipping.
  - 'Cross-season discontinuities that are not trends: sweeper classification arrives in 2023, shift restrictions
    change in 2023, bat tracking arrives mid-2024, swing path in 2025. Any 2023-2026 series has to be
    read with those breakpoints in mind.'
  closing: '## How this file stays honest


    Every warning above that could be checked against data has been. The xwOBA non-contact finding was
    not known when this file was first drafted -- it came out of `audit.py` failing an integrity check
    that asserted the textbook behaviour, against the actual database. That is the intended workflow:
    assertions in the audit, corrections in the schema, neither one taken on trust.


    Re-run `python3 audit.py` after every backfill. If an integrity check fails, the schema is wrong until
    proven otherwise, not the data. A column that appears in the database but not in `schema.yaml` is
    reported by the audit as undocumented rather than passing through unnoticed.'
tables:
  pitches:
    description: 'One row per pitch, roughly 700,000 per full season. Source: `pybaseball.statcast()`,
      which wraps Baseball Savant''s CSV search endpoint.'
    key_note: There is NO primary key -- Savant does not ship one, and re-ingesting a day would duplicate
      it, which is why `ingest_log` exists. `(game_pk, at_bat_number, pitch_number)` is unique in practice
      and is the key to use for joins and dedup checks.
    groups:
    - name: Identity and context
      columns:
        game_pk:
          desc: MLB's game identifier. Join key to any other MLB data source.
          unit: int
        game_date:
          desc: Date of the game. Stored as text so string comparison sorts correctly.
          unit: YYYY-MM-DD
        game_year:
          desc: Season. Use this rather than parsing game_date.
          unit: int
        game_type:
          desc: R regular, S spring, F/D/L/W postseason rounds, E exhibition.
          unit: code
          gotcha: Filter to 'R' for every leaderboard-style metric. Spring training and postseason rows
            contaminate qualified-player statistics.
        home_team:
          desc: Home team, three-letter code. Not stable across relocations.
          unit: code
        away_team:
          desc: Away team, three-letter code.
          unit: code
        inning:
          desc: Inning number.
          unit: int
        inning_topbot:
          desc: Top or Bot.
          unit: code
        at_bat_number:
          desc: Sequential within the game, across both teams.
          unit: int
        pitch_number:
          desc: Sequential within the plate appearance.
          unit: int
        batter:
          desc: MLBAM player ID of the batter. The join key for batter-level work.
          unit: id
        pitcher:
          desc: MLBAM player ID of the pitcher.
          unit: id
        stand:
          desc: Batter handedness, L or R.
          unit: code
        p_throws:
          desc: Pitcher handedness, L or R.
          unit: code
        player_name:
          desc: Player name as Savant supplies it.
          unit: text
          gotcha: This is the PITCHER's name, not the batter's, regardless of the player_type used in
            the query. A long-standing Savant quirk that has silently corrupted a great deal of public
            analysis. Join on batter/pitcher IDs instead.
        des:
          desc: Free-text play description.
          unit: text
        fielder_2:
          desc: MLBAM ID of the fielder at position 2. fielder_2 is the catcher.
          unit: id
        fielder_3:
          desc: MLBAM ID of the fielder at position 3.
          unit: id
        fielder_4:
          desc: MLBAM ID of the fielder at position 4.
          unit: id
        fielder_5:
          desc: MLBAM ID of the fielder at position 5.
          unit: id
        fielder_6:
          desc: MLBAM ID of the fielder at position 6.
          unit: id
        fielder_7:
          desc: MLBAM ID of the fielder at position 7.
          unit: id
        fielder_8:
          desc: MLBAM ID of the fielder at position 8.
          unit: id
        fielder_9:
          desc: MLBAM ID of the fielder at position 9.
          unit: id
    - name: Count, base-out and score state
      columns:
        balls:
          desc: Ball count BEFORE this pitch.
          unit: int
          range:
          - 0
          - 3
        strikes:
          desc: Strike count BEFORE this pitch.
          unit: int
          range:
          - 0
          - 2
        outs_when_up:
          desc: Outs before the plate appearance.
          unit: int
          range:
          - 0
          - 2
        on_1b:
          desc: MLBAM ID of the runner on first, NULL if the base is empty.
          unit: id
          applies_when: 1=1
          applies_label: all pitches (null = base empty, not missing)
          gotcha: Not a 0/1 flag. The test is `on_1b IS NOT NULL`.
        on_2b:
          desc: MLBAM ID of the runner on second, NULL if empty.
          unit: id
          applies_when: 1=1
          applies_label: all pitches (null = base empty, not missing)
        on_3b:
          desc: MLBAM ID of the runner on third, NULL if empty.
          unit: id
          applies_when: 1=1
          applies_label: all pitches (null = base empty, not missing)
        home_score:
          desc: Home score before the pitch.
          unit: runs
        away_score:
          desc: Away score before the pitch.
          unit: runs
        post_home_score:
          desc: Home score after the pitch.
          unit: runs
        post_away_score:
          desc: Away score after the pitch.
          unit: runs
        bat_score:
          desc: Batting team's score before the pitch.
          unit: runs
        fld_score:
          desc: Fielding team's score before the pitch.
          unit: runs
        post_bat_score:
          desc: Batting team's score after the pitch.
          unit: runs
        post_fld_score:
          desc: Fielding team's score after the pitch.
          unit: runs
        home_score_diff:
          desc: Home score minus away score.
          unit: runs
        bat_score_diff:
          desc: Batting team's score differential.
          unit: runs
        home_win_exp:
          desc: Home team win expectancy before the pitch.
          unit: prob 0-1
        bat_win_exp:
          desc: Batting team win expectancy before the pitch.
          unit: prob 0-1
        delta_home_win_exp:
          desc: Change in the home team's win expectancy across the PLATE APPEARANCE.
          unit: prob
          gotcha: Two things to keep straight. It is signed to the HOME team, not to whoever did something
            good. And it is measured per plate appearance, while delta_run_exp is per PITCH -- different
            denominators, so they cannot be summed together.
        if_fielding_alignment:
          desc: Standard, Infield shift, or Strategic.
          unit: code
          gotcha: The 2023 shift restrictions make this non-comparable across the 2022/2023 boundary.
            'Infield shift' means something different before and after.
        of_fielding_alignment:
          desc: Standard, Strategic, or 4th outfielder.
          unit: code
    - name: Pitch characteristics
      columns:
        pitch_type:
          desc: 'Two-letter code: FF four-seam, SI sinker, SL slider, ST sweeper, SV slurve, CU curve,
            KC knuckle-curve, CH change, FS splitter, FC cutter, KN knuckleball, EP eephus, PO pitchout.'
          unit: code
          since: null
          gotcha: ST and SV were introduced in 2023. Sweepers before that are classified as SL, so a pitch-type
            time series crossing 2022 into 2023 has a discontinuity that is a relabelling, not a trend.
        pitch_name:
          desc: Human-readable form of pitch_type.
          unit: text
        release_speed:
          desc: Velocity out of hand, measured ~50 ft from the plate.
          unit: mph
          range:
          - 50
          - 106
        effective_speed:
          desc: Perceived velocity, adjusted for extension. A short-extension 95 plays slower than a long-extension
            95.
          unit: mph
          range:
          - 50
          - 110
        release_spin_rate:
          desc: Spin rate at release.
          unit: rpm
          range:
          - 500
          - 3600
        spin_axis:
          desc: Inferred spin axis, clock-face converted.
          unit: degrees 0-360
        release_pos_x:
          desc: Horizontal release point, catcher's view.
          unit: feet
        release_pos_z:
          desc: Vertical release point.
          unit: feet
        release_pos_y:
          desc: Distance from home plate at release; approximately 60.5 minus extension.
          unit: feet
        release_extension:
          desc: How far in front of the rubber the ball is released.
          unit: feet
          range:
          - 3.0
          - 8.5
        pfx_x:
          desc: Horizontal movement versus a spinless pitch.
          unit: feet
          range:
          - -3
          - 3
          gotcha: Signed by direction, not by handedness. Multiply by -1 for left-handed pitchers before
            pooling, or arm-side and glove-side movement cancel.
        pfx_z:
          desc: Vertical movement versus a spinless pitch.
          unit: feet
          range:
          - -3
          - 3
        plate_x:
          desc: Horizontal location at the front of the plate; 0 is the centre of the plate.
          unit: feet
          range:
          - -4
          - 4
          gotcha: For platoon-neutral work, flip by batter handedness. audit.py reports mean plate_x by
            `stand` so the sign convention is confirmed empirically rather than assumed.
        plate_z:
          desc: Height at the front of the plate; 0 is the ground.
          unit: feet
          range:
          - -2
          - 7
        sz_top:
          desc: Top of the strike zone for this batter on this pitch.
          unit: feet
          range:
          - 2.5
          - 4.8
          gotcha: 'THE STRIKE ZONE DEFINITION CHANGES IN 2026. Through 2025 sz_top and sz_bot were set
            by a human operator per pitch and varied continuously; from 2026 they are ABS-defined, derived
            from batter height. This database shows it starkly: 348,556 distinct sz_top values in 2025
            against 390 in 2026. Every zone-derived metric -- zone rate, chase rate, called-strike rate,
            edge command, catcher framing -- has a hard discontinuity at 2026 that is a MEASUREMENT change,
            not a behaviour change. Framing value in particular should collapse toward zero in 2026 by
            construction.'
        sz_bot:
          desc: Bottom of the strike zone for this batter on this pitch.
          unit: feet
          range:
          - 0.8
          - 2.5
          gotcha: 'See sz_top: ABS-defined from 2026, operator-set before that.'
        zone:
          desc: 1-9 inside the zone (3x3 grid, catcher's view), 11-14 the outside quadrants.
          unit: int
        vx0:
          desc: Velocity component at y = 50 ft, horizontal.
          unit: ft/s
        vy0:
          desc: Velocity component at y = 50 ft, toward the plate. Large and negative.
          unit: ft/s
        vz0:
          desc: Velocity component at y = 50 ft, vertical.
          unit: ft/s
        ax:
          desc: Acceleration, horizontal.
          unit: ft/s^2
        ay:
          desc: Acceleration, toward the plate.
          unit: ft/s^2
        az:
          desc: Acceleration, vertical. Includes gravity, so roughly -32 plus Magnus.
          unit: ft/s^2
        api_break_z_with_gravity:
          desc: 'Total vertical break including gravity: the drop a hitter actually sees.'
          unit: inches
        api_break_x_arm:
          desc: Horizontal break toward the arm side. Already handedness-corrected, unlike pfx_x.
          unit: inches
        api_break_x_batter_in:
          desc: Horizontal break toward the batter.
          unit: inches
        arm_angle:
          desc: Angle between a line parallel to the ground and a line from the pitcher's shoulder to
            the ball at release. 0 is sidearm, 90 is straight over the top.
          unit: degrees
          range:
          - -20
          - 100
    - name: Outcome
      columns:
        type:
          desc: B ball, S strike, X in play.
          unit: code
          gotcha: '`type = ''X''` is the only reliable test for contact. See estimated_woba_using_speedangle.'
        description:
          desc: 'Detailed pitch result: called_strike, swinging_strike, foul, hit_into_play, ball, blocked_ball,
            hit_by_pitch and so on. The column for whiff-rate work.'
          unit: text
        events:
          desc: 'Plate-appearance outcome: single, home_run, strikeout, walk, field_out and so on.'
          unit: text
          applies_when: woba_denom = 1
          applies_label: completed plate appearances
          gotcha: Populated only on the final pitch of a plate appearance; NULL on every other pitch.
        bb_type:
          desc: ground_ball, line_drive, fly_ball, or popup.
          unit: code
          applies_when: type = 'X'
          applies_label: balls in play
        hit_location:
          desc: Fielder position that fielded the ball, 1-9.
          unit: int
          applies_when: type = 'X'
          applies_label: balls in play
        hc_x:
          desc: Spray-chart x coordinate in Savant's image space.
          unit: pixels
          applies_when: type = 'X'
          applies_label: balls in play
          gotcha: 'Origin is the TOP-LEFT and hc_y increases DOWNWARD. Convert before use: x_ft = (hc_x
            - 125.42) * 2.0, y_ft = (198.27 - hc_y) * 2.0. Plotting raw produces a vertically mirrored
            field.'
        hc_y:
          desc: Spray-chart y coordinate in Savant's image space.
          unit: pixels
          applies_when: type = 'X'
          applies_label: balls in play
        hit_distance_sc:
          desc: Projected distance of the batted ball.
          unit: feet
          range:
          - 0
          - 520
          applies_when: type = 'X'
          applies_label: balls in play
        launch_speed:
          desc: Exit velocity off the bat.
          unit: mph
          range:
          - 5
          - 125
          applies_when: type = 'X'
          applies_label: balls in play
        launch_angle:
          desc: Vertical launch angle. Stored as INTEGER; Savant rounds it.
          unit: degrees
          range:
          - -90
          - 90
          applies_when: type = 'X'
          applies_label: balls in play
        launch_speed_angle:
          desc: 'Launch speed/angle zone: 1 weak, 2 topped, 3 under, 4 flare/burner, 5 solid contact,
            6 barrel.'
          unit: int 1-6
          applies_when: type = 'X'
          applies_label: balls in play
        hyper_speed:
          desc: 'Adjusted exit velocity: batted balls below 88 mph are set to 88 mph, otherwise the actual
            exit velocity. Savant''s definition, not an inference.'
          unit: mph
          gotcha: A FLOOR, not a smoothing. It measures top-end contact by discarding the bottom of the
            distribution, so it is not a substitute for launch_speed in any average.
    - name: Expected stats and run values
      columns:
        estimated_ba_using_speedangle:
          desc: xBA on contact, from exit velocity and launch angle, plus sprint speed for weakly-hit
            and topped balls.
          unit: 0-1
          applies_when: type = 'X'
          applies_label: balls in play
          gotcha: 'Unlike xwOBA, this is still contact-only, verified at zero non-contact rows populated.
            The classic warning holds: averaging it across all plate appearances drops strikeouts from
            the numerator while the denominator counts them.'
        estimated_woba_using_speedangle:
          desc: 'xwOBA. In this database it carries PA-ending non-contact events at their linear weight:
            strikeout 0.000, walk 0.698, HBP 0.729.'
          unit: wOBA scale
          range:
          - 0
          - 2.5
          applies_when: woba_denom = 1
          applies_label: completed plate appearances
          gotcha: THE CONVENTION CHANGED. The long-standing public understanding is that this is NULL
            on strikeouts and walks; in the 2026 data it is populated. So `IS NOT NULL` is not a batted-ball
            filter -- use type = 'X'. If seasons follow different conventions, code branching on null-ness
            computes a different statistic per season with no error raised. audit.py checks this per season.
        estimated_slg_using_speedangle:
          desc: xSLG on contact.
          unit: slg scale
          applies_when: type = 'X'
          applies_label: balls in play
        woba_value:
          desc: 'This event''s wOBA numerator contribution: 0 for outs, ~0.70 for a walk, ~2.10 for a
            home run. Weights drift year to year.'
          unit: wOBA scale
        woba_denom:
          desc: 1 if the event counts as a wOBA denominator plate appearance.
          unit: 0/1
          gotcha: '`WHERE woba_denom = 1` is how you get exactly one row per completed plate appearance.'
        babip_value:
          desc: BABIP indicator flag.
          unit: 0/1
        iso_value:
          desc: Isolated-power indicator flag.
          unit: 0/1
        delta_run_exp:
          desc: Change in run expectancy on this pitch.
          unit: runs
          range:
          - -4
          - 4
          gotcha: 'From the BATTING team''s perspective: positive is good for the hitter, so a strikeout
            is negative.'
        delta_pitcher_run_exp:
          desc: The same quantity from the pitcher's perspective, sign inverted.
          unit: runs
          gotcha: Using this and delta_run_exp in one model double-counts the same event.
    - name: Bat tracking and swing path
      note: 'The newest and least-exploited columns here. MEASURED availability contradicts the public
        timeline: bat tracking was announced in May 2024, but this database has it from JULY 2023 -- Savant
        back-processed the 2023 second half, and the distributions are indistinguishable from later seasons
        (mean bat speed 69.6 in 2023 versus 69.5 in 2024). That is an extra half-season of swing data
        most public analysis does not use. Coverage is partial even within a season because the tracking
        has to see the bat cleanly, so pair any bat-tracking aggregate with an N.'
      columns:
        bat_speed:
          desc: Barrel speed at contact, or at the nearest point on a swing and miss.
          unit: mph
          range:
          - 20
          - 95
          since: 2023-07
          applies_when: description LIKE '%swing%' OR description LIKE '%foul%' OR type = 'X'
          applies_label: swings
          gotcha: Two artefacts. The maximum is EXACTLY 88.0 in all four seasons, which is a clamp rather
            than a physical limit -- do not treat the top of the distribution as real. And roughly 0.5%
            of values fall under 20 mph (minimum 0.3), which are failed reads, not check swings. Filter
            both tails before computing a player's mean.
        swing_length:
          desc: Path length of the barrel through the swing. Longer means more time to react but more
            distance to cover.
          unit: feet
          range:
          - 2
          - 12
          since: 2023-07
          applies_when: description LIKE '%swing%' OR description LIKE '%foul%' OR type = 'X'
          applies_label: swings
        attack_angle:
          desc: Vertical angle at which the sweet spot of the bat travels at the impact point.
          unit: degrees
          range:
          - -40
          - 60
          since: 2023-07
          applies_when: type = 'X'
          applies_label: balls in play
        attack_direction:
          desc: Horizontal angle at which the sweet spot of the bat travels at impact, measured RELATIVE
            TO CENTER FIELD.
          unit: degrees
          since: 2023-07
          applies_when: type = 'X'
          applies_label: balls in play
          gotcha: Because it is referenced to center field rather than to the pull side, its sign does
            not flip by batter handedness -- pull for a lefty and pull for a righty land on opposite sides
            of zero. Flip by `stand` before pooling.
        swing_path_tilt:
          desc: Vertical angular orientation of the swing plane over the 40 ms before contact.
          unit: degrees
          since: 2023-07
          applies_when: type = 'X'
          applies_label: balls in play
        intercept_ball_minus_batter_pos_x_inches:
          desc: Horizontal distance, in inches, between the intercept point and the batter's centre of
            mass.
          unit: inches
          since: 2023-07
        intercept_ball_minus_batter_pos_y_inches:
          desc: Distance, in inches, from the batter's centre of mass to the intercept point along the
            mound-to-plate axis.
          unit: inches
          since: 2023-07
        miss_distance:
          desc: On a swinging strike, how far the barrel missed the ball.
          unit: inches
          since: 2023-07
          applies_when: description = 'swinging_strike'
          applies_label: swinging strikes
    - name: Age, workload and sequencing
      columns:
        age_pit:
          desc: Pitcher's age as of 12/31 of the season.
          unit: years
        age_bat:
          desc: Batter's age as of 12/31 of the season.
          unit: years
        age_pit_legacy:
          desc: Pitcher's age as of 6/30. Savant's prior convention, kept for continuity.
          unit: years
        age_bat_legacy:
          desc: Batter's age as of 6/30. Savant's prior convention, kept for continuity.
          unit: years
        n_thruorder_pitcher:
          desc: Times through the order. The times-through-the-order penalty is one of the most robust
            effects in the data.
          unit: int
        n_priorpa_thisgame_player_at_bat:
          desc: Prior plate appearances this game for this batter.
          unit: int
        pitcher_days_since_prev_game:
          desc: Pitcher's rest.
          unit: days
        batter_days_since_prev_game:
          desc: Batter's rest.
          unit: days
        pitcher_days_until_next_game:
          desc: Days until the pitcher's next game.
          unit: days
          gotcha: Look-ahead. Legitimate for descriptive work, LEAKAGE in any predictive model -- it encodes
            the future.
        batter_days_until_next_game:
          desc: Days until the batter's next game.
          unit: days
          gotcha: Look-ahead. Same leakage warning as the pitcher column.
    - name: Dead columns
      note: Savant retains these headers and returns nothing. They are stored only because the ingest
        keeps every column Savant sends.
      columns:
        spin_dir:
          desc: Retained by Savant, never populated.
          dead: true
        spin_rate_deprecated:
          desc: Retained by Savant, never populated.
          dead: true
        break_angle_deprecated:
          desc: Retained by Savant, never populated.
          dead: true
        break_length_deprecated:
          desc: Retained by Savant, never populated.
          dead: true
        tfs_deprecated:
          desc: Retained by Savant, never populated.
          dead: true
        tfs_zulu_deprecated:
          desc: Retained by Savant, never populated.
          dead: true
        sv_id:
          desc: Non-unique id of the play event within a game. Not populated in this database.
          dead: true
        umpire:
          desc: Retained by Savant, never populated.
          dead: true
  expected_stats:
    description: One row per player per snapshot, from Savant's expected-statistics leaderboard. This
      is NOT recomputed from the pitch table -- it is Savant's own season aggregate and will not exactly
      reconcile with a sum over `pitches`. Minimum 50 PA, set at fetch time.
    groups:
    - name: Columns
      columns:
        snapshot_date:
          desc: When this leaderboard state was captured. A completed season is stamped with its final
            day; the in-progress season with today. Part of the primary key, which is what lets you watch
            a gap open over time.
          unit: YYYY-MM-DD
        player_type:
          desc: batter or pitcher.
          unit: code
        player_id:
          desc: MLBAM ID. Joins to pitches.batter / pitches.pitcher.
          unit: id
        player_name:
          desc: Normalised to 'First Last'.
          unit: text
        year:
          desc: Season the leaderboard covers.
          unit: int
        pa:
          desc: Plate appearances, or batters faced for pitchers.
          unit: int
        bip:
          desc: Balls in play.
          unit: int
        ba:
          desc: Actual batting average.
          unit: 0-1
        est_ba:
          desc: Expected batting average.
          unit: 0-1
        slg:
          desc: Actual slugging.
          unit: slg scale
        est_slg:
          desc: Expected slugging.
          unit: slg scale
        woba:
          desc: Actual wOBA.
          unit: wOBA scale
        est_woba:
          desc: Expected wOBA. The two columns the whole dashboard rests on.
          unit: wOBA scale
  batted_ball:
    description: Exit velocity and barrel leaderboard. Minimum 30 batted balls, set at fetch time.
    groups:
    - name: Columns
      columns:
        attempts:
          desc: Batted-ball events. The denominator for everything else here.
          unit: int
        avg_hit_speed:
          desc: Average exit velocity.
          unit: mph
        max_hit_speed:
          desc: Maximum exit velocity. A skill indicator, but a single-observation one, so noisy.
          unit: mph
        avg_launch_angle:
          desc: Average launch angle.
          unit: degrees
          gotcha: An average over a bimodal distribution. Two hitters with identical averages can have
            completely different distributions.
        barrels:
          desc: Count of barrels.
          unit: int
        brl_percent:
          desc: Barrels per batted ball.
          unit: '%'
        brl_pa:
          desc: Barrels per plate appearance. Generally the better of the two -- it does not reward a
            hitter for avoiding contact.
          unit: '%'
        ev95percent:
          desc: 'Hard-hit rate: share of batted balls at 95+ mph.'
          unit: '%'
  ingest_log:
    description: Fetch bookkeeping. A day absent from this table was never successfully fetched. A failed
      request is deliberately NOT logged, so a re-run retries it.
    groups:
    - name: Columns
      columns:
        scope:
          desc: Currently always 'pitches'.
          unit: text
        day:
          desc: Day fetched.
          unit: YYYY-MM-DD
        rows:
          desc: Rows stored. 0 means a genuine off-day, recorded so it is never re-requested.
          unit: int
        fetched_at:
          desc: UTC timestamp of the fetch.
          unit: ISO 8601
  sprint_speed:
    description: 'Sprint speed leaderboard: feet per second in a player''s fastest one-second window,
      averaged over roughly his fastest two thirds of opportunities. Fetched fresh each pipeline run rather
      than backfilled, because it is one small request. This is the one table here that measures the RUNNER
      rather than the ball, which is exactly why it exists -- the pitch table structurally cannot see
      it.'
    groups:
    - name: Columns
      columns:
        snapshot_date:
          desc: When the leaderboard was captured.
          unit: YYYY-MM-DD
        player_id:
          desc: MLBAM ID. Joins to pitches.batter.
          unit: id
        player_name:
          desc: Normalised to 'First Last'.
          unit: text
        year:
          desc: Season.
          unit: int
        age:
          desc: Player age.
          unit: years
        competitive_runs:
          desc: 'Qualifying sprint opportunities: two-plus base runs on non-homers, and home-to-first
            on topped or weakly-hit balls.'
          unit: int
        bolts:
          desc: Runs at 30 ft/s or faster. A count of elite-speed events, so it is noisier than the mean.
          unit: int
        hp_to_1b:
          desc: Home-to-first time.
          unit: seconds
        sprint_speed:
          desc: Feet per second. League average is roughly 27; 30+ is elite.
          unit: ft/s
          range:
          - 20
          - 32
derived:
  note: Computed in analyze.py and written to output/dashboard_data.json. None come from Savant; all are
    arguable.
  metrics:
    luck_gap:
      formula: est_woba - woba
      assumes: That the gap is mostly luck. It is not entirely -- speed and spray tendency create persistent
        gaps.
    luck_z:
      formula: luck_gap z-scored against that season's qualified players of the same type
      assumes: That the gap distribution is roughly normal and that the current season is the right reference
        population.
    outlook:
      formula: luck_z for batters, -luck_z for pitchers
      assumes: Sign normalisation so positive always means 'expect improvement'.
    proj_woba_ros:
      formula: (est_woba * PA + league_mean * K) / (PA + K), K = 200 batters / 250 pitchers
      assumes: Marcel-style shrinkage. No aging curve, no park factors, no playing-time forecast, no platoon
        split.
    proj_vs_current:
      formula: proj_woba_ros - woba
      assumes: The size of the implied move.
    pct_est_woba / pct_woba:
      formula: Percentile rank among qualified players
      assumes: Qualified players are the right comparison set.
    pct_ev / pct_barrel / pct_hardhit:
      formula: Contact-quality percentiles from batted_ball
      assumes: A luck gap without contact-quality support is much more likely to be noise.
    qualified:
      formula: pa >= 150
      assumes: A blunt gate. Metrics stabilise at different rates; one threshold cannot be right for all
        of them.
    flagged:
      formula: qualified AND abs(luck_z) >= 1.5
      assumes: About 13% of players by construction, so the list is never empty -- including in a season
        where nothing interesting happened.
    sprint_speed:
      formula: joined from the sprint_speed table, batters only
      assumes: That a pitcher's own speed is irrelevant to the hitters he faces, so pitcher rows are left
        null.
    luck_gap_adj:
      formula: luck_gap minus the part predicted by a linear fit of luck_gap on sprint_speed, re-centred
      assumes: That the speed-explained part of the gap is skill, not luck. Fitted per run; the coefficient
        and R-squared are written into the payload so the assumption can be checked rather than trusted.
    luck_z_adj:
      formula: luck_gap_adj z-scored against qualified players of the same type
      assumes: Same as luck_z, on the speed-residualised gap.
    outlook_adj:
      formula: luck_z_adj for batters, -luck_z_adj for pitchers
      assumes: Reported ALONGSIDE outlook, never replacing it. Which one predicts better is a question
        for regression_test.py, not an assumption.
    pct_sprint:
      formula: Sprint-speed percentile among qualified batters
      assumes: Context for reading a flagged player -- a fast player near the top of this column is the
        classic false positive the raw luck gap produces.
